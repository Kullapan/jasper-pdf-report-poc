server:
  port: 8080

spring:
  application:
    name: claim-report-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claimdb}
    username: ${SPRING_DATASOURCE_USERNAME:claimuser}
    password: ${SPRING_DATASOURCE_PASSWORD:claimpass_local_poc}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

services:
  pdf-generator:
    url: ${PDF_GENERATOR_SERVICE_URL:http://localhost:8082}
  signing:
    url: ${SIGNING_SERVICE_URL:http://localhost:8081}
